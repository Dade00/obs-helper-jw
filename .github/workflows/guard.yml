name: guard-no-binaries

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rifiuta binari e file locali nel diff
        run: |
          FILES=$(git diff --name-only origin/master...HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "$FILES"
          BAD=$(echo "$FILES" | grep -Ei '^(bin|obj)/|\.exe$|\.dll$|\.pdb$|\.log$|(^|/)config\.json$|(^|/)baseline\.png$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::File vietati nella PR:"; echo "$BAD"; exit 1
          fi
          echo "Guard OK."
